services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Optional: protect the UI and API with HTTP basic auth (user "admin").
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - rag-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Default vector store. Pick it in the setup wizard with host "postgres".
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Optional: docker compose --profile qdrant up
  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["qdrant"]
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Optional local models: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  rag-data:
  pg-data:
  qdrant-data:
  ollama-data:
