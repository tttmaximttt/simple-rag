services:
  app:
    build: .
    ports:
      # Only reachable from this host; put a TLS reverse proxy in front for outside access.
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      # First-run admin login. If ADMIN_PASSWORD is empty, a random temporary password
      # is printed to the logs. Either way it must be changed at first login.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Public HTTPS URL, e.g. https://rag.example.com (used in /v1/openapi.json for GPT Actions).
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Behind a reverse proxy, set this to the proxy's address (e.g. the docker network range,
      # 172.16.0.0/12) so client IPs come from X-Forwarded-For. Never use "*": anyone could fake their IP.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    volumes:
      - rag-data:/data
      # Drop PDFs into ./import and click "Import from server folder" (read-only mount).
      - ./import:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Default vector store. Pick it in the setup wizard with host "postgres".
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Optional: docker compose --profile qdrant up
  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["qdrant"]
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Optional local models: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  rag-data:
  pg-data:
  qdrant-data:
  ollama-data:
